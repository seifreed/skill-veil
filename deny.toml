[graph]
targets = []
all-features = true

[advisories]
version = 2
ignore = [
    # wasmtime 40.0.4 (transitive via yara-x) — no fix in 40.x line
    "RUSTSEC-2026-0085",
    "RUSTSEC-2026-0086",
    "RUSTSEC-2026-0087",
    "RUSTSEC-2026-0088",
    "RUSTSEC-2026-0089",
    "RUSTSEC-2026-0091",
    "RUSTSEC-2026-0092",
    "RUSTSEC-2026-0093",
    "RUSTSEC-2026-0094",
    "RUSTSEC-2026-0095",
    "RUSTSEC-2026-0096",
    # rsa 0.9.10 (transitive via yara-x) — no fixed version available
    "RUSTSEC-2023-0071",
    # bincode 2.0.1 (transitive via yara-x) — unmaintained, no alternative in yara-x
    "RUSTSEC-2025-0141",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "0BSD",
    "LGPL-2.1-or-later",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
# All duplicates below are transitive via yara-x and cannot be resolved
# without an upstream release. Skip them to keep deny output clean.
skip = [
    { crate = "foldhash@0.1.5" },
    { crate = "getrandom@0.2.17" },
    { crate = "hashbrown@0.14.5" },
    { crate = "hashbrown@0.15.5" },
    { crate = "hashbrown@0.16.1" },
    { crate = "linux-raw-sys@0.4.15" },
    { crate = "nom@7.1.3" },
    { crate = "rustc-hash@1.1.0" },
    { crate = "rustix@0.38.44" },
    { crate = "strum_macros@0.26.4" },
    { crate = "thiserror@1.0.69" },
    { crate = "thiserror-impl@1.0.69" },
    { crate = "wasm-encoder@0.243.0" },
    { crate = "wasmparser@0.243.0" },
    { crate = "windows-sys@0.59.0" },
    { crate = "zip@2.4.2" },
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
