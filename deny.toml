[graph]
targets = []
all-features = true

[advisories]
version = 2
ignore = [
    # rsa 0.9.10 (transitive via yara-x) — no fixed version available
    "RUSTSEC-2023-0071",
    # bincode 2.0.1 (transitive via yara-x) — unmaintained, no alternative in yara-x
    "RUSTSEC-2025-0141",
    # paste 1.0.15 (transitive via fastembed → tokenizers / macro_rules_attribute)
    # — author archived the crate; no safe upgrade available upstream.
    "RUSTSEC-2024-0436",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "0BSD",
    "LGPL-2.1-or-later",
    # Permissive, GPL-3.0-compatible licenses on transitive deps:
    # ISC (ring, hmac-sha256 via rustls/ort) — functionally MIT-equivalent;
    # MPL-2.0 (option-ext via dirs) — file-level weak copyleft, GPL-compatible;
    # CDLA-Permissive-2.0 (webpki-roots via ureq) — permissive CA-bundle data license.
    "ISC",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
# All duplicates below are transitive via yara-x and cannot be resolved
# without an upstream release. Skip them to keep deny output clean.
skip = [
    { crate = "getrandom@0.2.17" },
    { crate = "gimli@0.32.3" },
    { crate = "hashbrown@0.14.5" },
    { crate = "hashbrown@0.16.1" },
    { crate = "hashbrown@0.17.0" },
    { crate = "linux-raw-sys@0.4.15" },
    { crate = "nom@7.1.3" },
    { crate = "rustc-hash@1.1.0" },
    { crate = "rustix@0.38.44" },
    { crate = "strum_macros@0.26.4" },
    { crate = "thiserror@1.0.69" },
    { crate = "thiserror-impl@1.0.69" },
    { crate = "windows-sys@0.59.0" },
    { crate = "zip@2.4.2" },
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/VirusTotal/yara-x"]
