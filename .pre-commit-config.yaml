repos:
  - repo: local
    hooks:
      - id: skill-veil-scan-package
        name: skill-veil scan-package
        entry: cargo run -q -p skill-veil -- scan-package . --format text --quiet-summary --fail-on high
        language: system
        pass_filenames: false
        require_serial: true
        stages:
          - pre-commit
          - pre-push
