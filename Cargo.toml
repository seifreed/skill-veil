[workspace]
resolver = "2"
members = [
    "crates/skill-veil-core",
    "crates/skill-veil-cli",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
authors = ["skill-veil contributors"]
license = "MIT"
repository = "https://github.com/seifreed/skill-veil"
description = "Behavioral & Supply-Chain Security Analysis for Agent Skills"

[workspace.dependencies]
# Core dependencies
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
toml = "0.8"

# Markdown parsing
pulldown-cmark = "0.10"

# Pattern matching
regex = "1.10"

# File system
walkdir = "2.5"
rayon = "1.10"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
tempfile = "3.10"

# CLI
clap = { version = "4.5", features = ["derive", "cargo"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Hashing
sha2 = "0.10"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Enum utilities
strum = { version = "0.26", features = ["derive"] }
strum_macros = "0.26"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
