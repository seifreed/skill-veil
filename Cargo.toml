[workspace]
resolver = "2"
members = [
    "crates/skill-veil-core",
    "crates/skill-veil-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["skill-veil contributors"]
license = "MIT"
repository = "https://github.com/seifreed/skill-veil"
description = "Behavioral & Supply-Chain Security Analysis for Agent Skills"

[workspace.dependencies]
# Core dependencies
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
toml = "0.8"

# Markdown parsing
pulldown-cmark = "0.10"

# Pattern matching
regex = "1.10"

# AST-based script analysis (Python / JavaScript / TypeScript). The grammar
# crates ship C sources compiled at build time via `cc`; they expose the
# `LanguageFn` ABI shared with the `tree-sitter` runtime.
tree-sitter = "0.26"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"

# File system
walkdir = "2.5"
globset = "0.4"
rayon = "1.10"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
tempfile = "3.27"
dirs = "5"

# HTTP (synchronous, used by VT integration tooling)
ureq = { version = "2.10", default-features = false, features = ["json", "tls"] }
url = "2.5"
base64 = "0.22"

# Compact LLM input format (token-efficient drop-in for JSON).
toon-format = { version = "0.4", default-features = false }

# CLI
clap = { version = "4.5", features = ["derive", "cargo"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Hashing
sha2 = "0.10"

# Ed25519 signature verification (used by `skill-veil init` to verify
# the manifest of the downloaded rules pack against the embedded public
# key). `default-features = false` drops the std-rand dependency we
# don't need on the verification-only path.
ed25519-dalek = { version = "2.1", default-features = false, features = ["std"] }

# Hex encoding for SHA-256 digests + tar+gzip extraction for the
# rules-pack release tarball.
hex = "0.4"
tar = "0.4"
flate2 = "1.0"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Enum utilities
strum = { version = "0.26", features = ["derive"] }
strum_macros = "0.26"

# Optional native sentence-embedding runtime, used only when the
# `nova-semantics` feature is enabled on `skill-veil-cli`. The default
# feature set on the upstream crate pulls `image-models` (~tens of MiB)
# and `native-tls`; we opt out of both. `ort-download-binaries-rustls-tls`
# means the ONNX runtime native lib is fetched at build time and
# bundled into the binary; `hf-hub-rustls-tls` lets the runtime fetch
# `all-MiniLM-L6-v2` from the Hugging Face hub on first use, cached
# under `~/.cache/huggingface/hub/` (or `InitOptions::cache_dir`).
fastembed = { version = "5.13", default-features = false, features = [
    "ort-download-binaries-rustls-tls",
    "hf-hub-rustls-tls",
] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
items_after_test_module = "deny"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
