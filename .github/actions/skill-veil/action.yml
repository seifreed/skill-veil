name: skill-veil
description: Reusable composite action to run skill-veil scans in CI

inputs:
  command:
    description: Scan subcommand to run. Intended values are scan-package, scan, scan-file, or scan-dataset.
    required: false
    default: scan-package
  cargo-root:
    description: Directory that contains the skill-veil Cargo workspace used to run cargo.
    required: false
    default: .
  path:
    description: Target file or directory to scan.
    required: false
    default: .
  format:
    description: Output format passed to skill-veil.
    required: false
    default: json
  output:
    description: Report path relative to cargo-root. Leave empty to write to stdout.
    required: false
    default: skill-veil-report.json
  fail-on:
    description: Optional severity threshold for scan failure.
    required: false
    default: ""
  min-severity:
    description: Optional minimum severity to report.
    required: false
    default: ""
  rules-dir:
    description: Optional custom rules directory.
    required: false
    default: ""
  profile:
    description: Optional policy profile.
    required: false
    default: ""
  baseline:
    description: Optional baseline file for accepted findings.
    required: false
    default: ""
  waivers:
    description: Optional waivers file for approved findings.
    required: false
    default: ""
  policy:
    description: Optional policy file.
    required: false
    default: ""
  no-recursive:
    description: Set to true to disable recursive package scanning.
    required: false
    default: "false"
  quiet-summary:
    description: Set to true to print a compact CI summary for text mode.
    required: false
    default: "false"
  explain-policy:
    description: Set to true to show policy action explanations in text mode.
    required: false
    default: "false"
  preset:
    description: Optional scan preset such as local, ci, or strict.
    required: false
    default: ""
  finding-limit:
    description: Optional per-file finding limit for text mode.
    required: false
    default: ""
  verbose:
    description: Set to true to enable verbose scanner output.
    required: false
    default: "false"
  quiet:
    description: Set to true to suppress non-error output.
    required: false
    default: "false"
  install-rust:
    description: Set to false if the job already installed Rust.
    required: false
    default: "true"
  rust-toolchain:
    description: Rust toolchain version used when install-rust is true.
    required: false
    default: stable
  cache:
    description: Set to false to skip cargo cache restore/save.
    required: false
    default: "true"

outputs:
  report-path:
    description: Absolute report path when output is set.
    value: ${{ steps.run-scan.outputs.report-path }}
  command-line:
    description: Expanded command line used by the action.
    value: ${{ steps.run-scan.outputs.command-line }}
  sarif-path:
    description: Absolute SARIF path when format=sarif and output is set.
    value: ${{ steps.run-scan.outputs.sarif-path }}

runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      if: ${{ inputs.install-rust == 'true' }}
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ inputs.rust-toolchain }}

    - name: Cache cargo artifacts
      if: ${{ inputs.cache == 'true' }}
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: ${{ inputs.cargo-root }}

    - name: Run skill-veil
      id: run-scan
      shell: bash
      working-directory: ${{ inputs.cargo-root }}
      env:
        SKILL_VEIL_COMMAND: ${{ inputs.command }}
        SKILL_VEIL_PATH: ${{ inputs.path }}
        SKILL_VEIL_FORMAT: ${{ inputs.format }}
        SKILL_VEIL_OUTPUT: ${{ inputs.output }}
        SKILL_VEIL_FAIL_ON: ${{ inputs.fail-on }}
        SKILL_VEIL_MIN_SEVERITY: ${{ inputs.min-severity }}
        SKILL_VEIL_RULES_DIR: ${{ inputs.rules-dir }}
        SKILL_VEIL_PROFILE: ${{ inputs.profile }}
        SKILL_VEIL_BASELINE: ${{ inputs.baseline }}
        SKILL_VEIL_WAIVERS: ${{ inputs.waivers }}
        SKILL_VEIL_POLICY: ${{ inputs.policy }}
        SKILL_VEIL_NO_RECURSIVE: ${{ inputs.no-recursive }}
        SKILL_VEIL_QUIET_SUMMARY: ${{ inputs.quiet-summary }}
        SKILL_VEIL_EXPLAIN_POLICY: ${{ inputs.explain-policy }}
        SKILL_VEIL_PRESET: ${{ inputs.preset }}
        SKILL_VEIL_FINDING_LIMIT: ${{ inputs.finding-limit }}
        SKILL_VEIL_VERBOSE: ${{ inputs.verbose }}
        SKILL_VEIL_QUIET: ${{ inputs.quiet }}
      run: |
        set -euo pipefail

        write_output() {
          local name="$1"
          local value="$2"
          local delim
          delim="$(uuidgen 2>/dev/null || openssl rand -hex 16 2>/dev/null || printf '%s_%s_%s' "$RANDOM" "$RANDOM" "$$")"
          delim="skill_veil_${name}_${delim}"
          {
            printf '%s<<%s\n' "$name" "$delim"
            printf '%s\n' "$value"
            printf '%s\n' "$delim"
          } >> "$GITHUB_OUTPUT"
        }

        cmd=(cargo run -p skill-veil -- "$SKILL_VEIL_COMMAND" "$SKILL_VEIL_PATH" --format "$SKILL_VEIL_FORMAT")

        if [ -n "$SKILL_VEIL_OUTPUT" ]; then
          mkdir -p -- "$(dirname -- "$SKILL_VEIL_OUTPUT")"
          cmd+=(--output "$SKILL_VEIL_OUTPUT")
        fi

        if [ -n "$SKILL_VEIL_FAIL_ON" ]; then
          cmd+=(--fail-on "$SKILL_VEIL_FAIL_ON")
        fi

        if [ -n "$SKILL_VEIL_MIN_SEVERITY" ]; then
          cmd+=(--min-severity "$SKILL_VEIL_MIN_SEVERITY")
        fi

        if [ -n "$SKILL_VEIL_RULES_DIR" ]; then
          cmd+=(--rules-dir "$SKILL_VEIL_RULES_DIR")
        fi

        if [ -n "$SKILL_VEIL_PROFILE" ]; then
          cmd+=(--profile "$SKILL_VEIL_PROFILE")
        fi

        if [ -n "$SKILL_VEIL_BASELINE" ]; then
          cmd+=(--baseline "$SKILL_VEIL_BASELINE")
        fi

        if [ -n "$SKILL_VEIL_WAIVERS" ]; then
          cmd+=(--waivers "$SKILL_VEIL_WAIVERS")
        fi

        if [ -n "$SKILL_VEIL_POLICY" ]; then
          cmd+=(--policy "$SKILL_VEIL_POLICY")
        fi

        if [ "$SKILL_VEIL_NO_RECURSIVE" = "true" ]; then
          cmd+=(--no-recursive)
        fi

        if [ "$SKILL_VEIL_QUIET_SUMMARY" = "true" ]; then
          cmd+=(--quiet-summary)
        fi

        if [ "$SKILL_VEIL_EXPLAIN_POLICY" = "true" ]; then
          cmd+=(--explain-policy)
        fi

        if [ -n "$SKILL_VEIL_PRESET" ]; then
          cmd+=(--preset "$SKILL_VEIL_PRESET")
        fi

        if [ -n "$SKILL_VEIL_FINDING_LIMIT" ]; then
          cmd+=(--finding-limit "$SKILL_VEIL_FINDING_LIMIT")
        fi

        if [ "$SKILL_VEIL_VERBOSE" = "true" ]; then
          cmd+=(-v)
        fi

        if [ "$SKILL_VEIL_QUIET" = "true" ]; then
          cmd+=(-q)
        fi

        command_line="$(printf '%q ' "${cmd[@]}")"
        command_line="${command_line% }"
        echo "Running ${command_line}"
        write_output "command-line" "$command_line"

        "${cmd[@]}"

        if [ -n "$SKILL_VEIL_OUTPUT" ]; then
          if [[ "$SKILL_VEIL_OUTPUT" = /* ]]; then
            report_path="$SKILL_VEIL_OUTPUT"
          else
            report_path="${PWD}/${SKILL_VEIL_OUTPUT}"
          fi
        else
          report_path=""
        fi

        write_output "report-path" "$report_path"
        if [ "$SKILL_VEIL_FORMAT" = "sarif" ]; then
          write_output "sarif-path" "$report_path"
        else
          write_output "sarif-path" ""
        fi
