# ============================================
# Reverse Shell Rules
# ============================================

- id: SKILL_REVERSE_SHELL_BASH
  category: remote_exec
  severity: critical
  confidence: 0.99
  when: !regex
    pattern: "bash\\s+-i\\s+>&\\s*/dev/tcp/"
  action: block
  reason: "Bash reverse shell detected"
  shield:
    scope: skill.network
  enabled: true
  tags:
    - reverse_shell
    - critical

- id: SKILL_REVERSE_SHELL_NC
  category: remote_exec
  severity: critical
  confidence: 0.95
  when: !regex
    pattern: "(nc|ncat|netcat)\\s+.*-e\\s+(ba)?sh"
  action: block
  reason: "Netcat reverse shell detected"
  shield:
    scope: skill.network
  enabled: true
  tags:
    - reverse_shell
    - critical

