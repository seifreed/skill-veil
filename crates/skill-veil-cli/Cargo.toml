[package]
name = "skill-veil"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "CLI for skill-veil behavioral analysis"
repository.workspace = true
readme = "../../README.md"
keywords = ["security", "agents", "cli", "supply-chain", "mcp"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "skill-veil"
path = "src/main.rs"

[dependencies]
skill-veil-core = { version = "0.1.3", path = "../skill-veil-core" }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
walkdir.workspace = true
rayon.workspace = true
zip.workspace = true
tempfile.workspace = true
dirs.workspace = true
ureq.workspace = true
url.workspace = true
toml.workspace = true
thiserror.workspace = true
base64.workspace = true
sha2.workspace = true
toon-format.workspace = true
urlencoding = "2.1.3"
ed25519-dalek.workspace = true
hex.workspace = true
tar.workspace = true
flate2.workspace = true

# Optional: native sentence embeddings for NOVA `semantics:` patterns.
# Build with `--features nova-semantics` to enable. Off by default
# because the upstream crate pulls the ONNX runtime native library
# (~30 MiB binary delta) and downloads `all-MiniLM-L6-v2` (~90 MiB)
# into the HF hub cache on first use. Mirrors the pattern already used
# for the optional `yara` integration.
fastembed = { workspace = true, optional = true }

[features]
default = []
# Enable the native NOVA `semantics:` evaluator backed by
# `all-MiniLM-L6-v2` via fastembed. The `--nova-semantics` runtime
# flag is parsed regardless; without this feature it warns and falls
# back to the `NotYetWiredSemantic` stub so the binary never fails
# closed because of a build-time choice the user did not make.
nova-semantics = ["dep:fastembed"]

[dev-dependencies]
tempfile.workspace = true
