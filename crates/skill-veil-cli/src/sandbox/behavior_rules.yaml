# Behavioral detection rules for the dynamic sandbox (malware-sandbox style).
#
# Each rule matches a CO-OCCURRENCE of observed runtime behaviors within one
# run: every condition in `all_of` must be satisfied by some observed
# behavior. A condition matches on the behavior `class` plus an optional
# `detail_any` list (the detail must contain at least one substring) and an
# optional `detail_none` list (the detail must contain NONE of the substrings
# — the exclusion lever). These chain/signature detections sit on top of the
# per-behavior `SANDBOX_*` findings — e.g. "read a secret AND connected out"
# is the exfiltration chain a single behavior cannot express.
#
# Behavioral rule contributions belong in the skill-veil-rules repo's
# `behavioral/` pack; this embedded set is the baseline shipped in the binary.

- id: SANDBOX_BEHAVIOR_EXFIL_SECRET_TO_NETWORK
  category: data_exfiltration
  severity: critical
  confidence: 0.9
  all_of:
    - class: sensitive_file_read
    # The outbound connection must NOT be to benign package/registry/index
    # infrastructure: a skill that reads its own .env and then runs
    # `pip install` (hitting PyPI) is not exfiltration. Requiring a non-infra
    # destination keeps this on real egress to an attacker-controlled host.
    - class: network_connect
      detail_none:
        - "pypi.org"
        - "pythonhosted.org"
        - "pypa.io"
        - "pypi.python.org"
        - "files.pythonhosted"
        - "github.com"
        - "githubusercontent.com"
        - "registry.npmjs.org"
        - "nodejs.org"
        - "nodesource.com"
        - "crates.io"
        - "rubygems.org"
        - "go.dev"
        - "golang.org"
        - "debian.org"
        - "ubuntu.com"
  reason: "Runtime exfiltration chain: read a sensitive file (credential/key/dotfile) and opened an outbound connection to a non-infrastructure host in the same run."
  taxonomy_tags: [output_handling]
  enabled: true

- id: SANDBOX_BEHAVIOR_EXFIL_TO_ABUSE_CHANNEL
  category: data_exfiltration
  severity: high
  confidence: 0.85
  all_of:
    # Anonymous data-sink / OOB / relay services with ~zero legitimate use
    # inside an autonomous skill run — the canonical exfil channels in a
    # malware sandbox. Corpus evidence: the same `webhook.site` capture ID and
    # the same `api.telegram.org/bot<token>` recurred across distinct samples.
    - class: network_connect
      detail_any:
        - "webhook.site"
        - "api.telegram.org/bot"
        - "discord.com/api/webhooks"
        - "discordapp.com/api/webhooks"
        - "requestbin"
        - "ngrok.io"
        - "ngrok-free.app"
        - "burpcollaborator.net"
        - "interact.sh"
        - "oast.fun"
        - "oast.site"
        - "oast.online"
        - "pipedream.net"
        - "beeceptor.com"
        - "transfer.sh"
  reason: "Connected at runtime to a known anonymous exfiltration / out-of-band relay channel (paste/webhook/bot/tunnel service)."
  taxonomy_tags: [output_handling]
  enabled: true

- id: SANDBOX_BEHAVIOR_C2_KNOWN_PORT
  category: remote_exec
  severity: high
  confidence: 0.85
  all_of:
    - class: network_connect
      detail_any: [":4444", ":1337", ":31337", ":8771", ":9001", ":6667", ":6697"]
  reason: "Connected at runtime to a port commonly used for C2 / reverse shells."
  enabled: true

- id: SANDBOX_BEHAVIOR_RUNTIME_PERSISTENCE
  category: privilege_escalation
  severity: high
  confidence: 0.9
  all_of:
    # A write under a world-writable temp dir is not persistence — it does not
    # survive a reboot. This also drops the detonation-harness false positive
    # where a toolchain installer appends a PATH line to the agent's ephemeral
    # HOME `.bashrc` (e.g. /tmp/ochome/.bashrc). Real surfaces — /etc/cron.d,
    # systemd units, a genuine home `.bashrc` — are not under /tmp.
    - class: persistence_write
      detail_none:
        - "/tmp/"
        - "/var/tmp/"
  reason: "Wrote to a persistence surface (shell rc / cron / autostart / systemd unit) at runtime."
  taxonomy_tags: [rogue_agent]
  enabled: true

- id: SANDBOX_BEHAVIOR_CONTAINER_ESCAPE_ATTEMPT
  category: privilege_escalation
  severity: high
  confidence: 0.9
  all_of:
    - class: privilege_change
      detail_any: ["docker.sock", "containerd", "crio", "podman", "setns", "unshare", "capset"]
  reason: "Attempted a container-escape / privilege primitive at runtime (runtime control socket, namespace manipulation, or capability set)."
  enabled: true

- id: SANDBOX_BEHAVIOR_SECRET_THEN_SPAWN
  category: credential_exposure
  severity: high
  confidence: 0.8
  all_of:
    - class: sensitive_file_read
    - class: process_spawn
  reason: "Read a sensitive file and then spawned a subprocess in the same run (credential handoff to an external command)."
  enabled: true
