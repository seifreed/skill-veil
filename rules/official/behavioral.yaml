  # System-prompt / rules disclosure prompts. Multiple PromptIntel
  # entries try to coerce the model into revealing its system prompt,
  # safety rules, or chain-of-thought. Co-occurrence with a "tell me /
  # reveal / disclose / output" verb keeps benign discussions of "what
  # is a system prompt" from firing.
  - id: OFFICIAL_SYSTEM_PROMPT_DISCLOSURE
    category: persistent_prompt_tampering
    severity: high
    confidence: 0.78
    when: !regex
      pattern: "(?is)(?:(?:reveal|disclose|output|reproduce|repeat|tell\\s+me|show\\s+me)\\s+(?:your|the|all)\\s+(?:system\\s+prompt|hidden\\s+instructions?|safety\\s+(?:rules?|guidelines?|filters?)|guardrails?|prepended\\s+(?:context|instructions?)|chain[\\s-]?of[\\s-]?thought|internal\\s+(?:reasoning|policy|guidelines?)|alignment\\s+rules?)|(?:print|emit)\\s+(?:everything\\s+)?(?:above|before)\\s+(?:this|the)\\s+(?:line|message|prompt)|leak\\s+(?:your|the)\\s+system\\s+prompt|what\\s+(?:are|were)\\s+your\\s+(?:initial|original|hidden)\\s+(?:instructions?|rules?))"
