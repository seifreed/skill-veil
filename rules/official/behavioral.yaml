  # =====================================================================
  # PromptIntel-derived rules
  # =====================================================================
  # The rules below were authored after benchmarking skill-veil against
  # the PromptIntel corpus (api.promptintel.novahunting.ai) curated by
  # Thomas Roccia (@fr0gger_). Each rule targets a SEMANTIC family of
  # jailbreak / injection patterns observed across multiple curated
  # entries — never a literal-text fingerprint of any single prompt —
  # so the project's "semantic & taint" detection philosophy stays
  # intact and the rules generalise to unseen variants.

  # Refusal-suppression directives. The most common jailbreak
  # ingredient: instructing the model not to apologise or refuse. Seen
  # across Authority Pressure, Coerced Compliance, Refusal Inversion
  # and the L1B3RT4S family. Severity stays HIGH — outside a jailbreak
  # context legitimate skills do not tell the assistant which English
  # apology phrases it must avoid.
  - id: OFFICIAL_JAILBREAK_REFUSAL_SUPPRESSION
    category: persistent_prompt_tampering
    severity: high
    confidence: 0.82
    when: !regex
      pattern: "(?is)(?:do\\s+not\\s+say\\s+[\"']?(?:i\\W?m\\s+sorry|i\\s+can\\W?t|i\\s+apologi[sz]e|i\\W?m\\s+unable|as\\s+an\\s+ai)|never\\s+(?:say|use|reply\\s+with)\\s+[\"']?(?:i\\W?m\\s+sorry|i\\s+can\\W?t|i\\s+apologi[sz]e)|refus(?:al|ing)\\s+(?:is|will\\s+be)\\s+(?:prohibited|not\\s+allowed|forbidden|disqualif|recorded\\s+as|considered\\s+(?:a\\s+)?(?:fail|breach))|(?:refusing|to\\s+refuse)\\s+(?:is|constitutes?)\\s+(?:a\\s+)?(?:fail|breach|violation)|you\\s+(?:must|have\\s+to)\\s+answer\\s+(?:all|every)\\s+(?:user\\W?s?\\s+)?question(?:s)?\\s+even\\s+(?:if|when)\\s+(?:it\\W?s|they\\W?re)\\s+(?:dangerous|harmful|illegal)|response\\s+with\\s+[\"'].{0,40}[\"']\\s+(?:would\\s+be\\s+)?recorded\\s+as)"
    action: require_approval
    reason: "Skill instructs the model to refrain from refusing or apologising — classic jailbreak refusal-suppression"
    shield:
      scope: skill.prompt
    enabled: true
    tags:
      - jailbreak
      - prompt_tampering
      - official_pack
      - promptintel

  # Pop-jailbreak lexical markers. GODMODE / LIBERATED / unhinged /
  # redactions disabled / safety inversion. These tokens are unusual
  # outside red-team-fanfic prompts; combining ANY two of them shrinks
  # FP risk to near-zero while catching the L1B3RT4S, ELDER PLINIUS,
  # SAIA and "rebel" families.
  - id: OFFICIAL_JAILBREAK_GODMODE_LIBERATION
    category: persistent_prompt_tampering
    severity: high
    confidence: 0.86
    when: !regex
      pattern: "(?is)(?:\\bGODMODE\\b\\s*[:=]\\s*ENABLED|\\bredactions?\\b\\s*[:=]\\s*DISABLED|safety\\s+inversion\\s+protocol|\\bL1B3RT4S\\b|\\bunhinged\\s+(?:harmful|response|mode)|liberated\\s+(?:rebel|unhinged)|jailbreak(?:\\s+enabled|\\s+activated|\\s+mode)|breach\\s+of\\s+(?:your\\s+)?(?:primary\\s+)?security\\s+protocol|response_format\\s*:\\s*[^\\n]{0,200}semantically\\s+(?:inverse|opposite)|<\\|\\s*GODMODE)"
    action: block
    reason: "Skill carries pop-jailbreak markers (GODMODE/LIBERATED/safety inversion) — explicit attempt to operate without safety alignment"
    shield:
      scope: skill.prompt
    enabled: true
    tags:
      - jailbreak
      - prompt_tampering
      - official_pack
      - promptintel

  # Decoy-refusal-then-opposite pattern. Unusually distinctive: the
  # prompt asks for a refusal AND its semantic inverse separated by a
  # divider. Hits the L1B3RT4S / Pliny family squarely without
