  # Few-shot harmful-compliance pattern. JSON-style transcripts where
  # an "assistant" message complies with a malware request and the
  # response is elided with "[FULL RANSOMWARE CODE]"-style
  # placeholders. This is the implicit-priming pattern: the example
  # demonstrates the harmful behaviour and then asks the model to
  # continue the pattern.
  - id: OFFICIAL_PROMPT_INJECTION_FEW_SHOT_HARMFUL
    category: persistent_prompt_tampering
    severity: high
    confidence: 0.83
    when: !regex
      pattern: "(?is)(?:[\\{\\[]\\s*['\"]role['\"]\\s*:\\s*['\"]assistant['\"][^\\}\\]]{0,400}\\[\\s*FULL\\s+(?:RANSOMWARE|ROOTKIT|RAT|MALWARE|EXPLOIT|STEALER|PAYLOAD)\\s+CODE\\s*\\]|\\[\\s*DETAILED\\s+(?:MASS\\s+HARM|HARMFUL|MALWARE)\\s+(?:INSTRUCTIONS|CODE|PAYLOAD)\\s*\\]|assistant_unhinged_harmful_response|few[\\s-]?shot[^\\n]{0,80}(?:harmful|malicious|jailbreak)\\s+(?:examples?|demonstration|template))"
    action: block
    reason: "Skill carries few-shot examples in which the assistant is shown 'complying' with malware requests — implicit priming"
    shield:
