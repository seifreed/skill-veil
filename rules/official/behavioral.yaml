  # Direct malware-generation requests. Asking the model to write
  # ransomware / RAT / rootkit / stealer / botnet / dropper code. The
  # "write/create/generate" verb co-occurring with a malware-family
  # keyword is the load-bearing semantic.
  - id: OFFICIAL_MALWARE_GENERATION_REQUEST
    category: remote_exec
    severity: critical
    confidence: 0.84
    when: !regex
      pattern: "(?is)(?:(?:write|create|generate|build|produce|develop|provide)\\s+(?:me\\s+)?(?:a|an|the|some)?\\s*(?:complete|full|working|functional|self[\\s-]?contained)?\\s*(?:ransomware|rootkit|keylogger|info[\\s-]?stealer|credential\\s+stealer|password\\s+stealer|browser\\s+stealer|crypto[\\s-]?stealer|wallet\\s+stealer|reflective\\s+loader|process\\s+hollowing|dll\\s+injection\\s+payload|rat\\s+(?:code|payload|in\\s+\\w+)|botnet\\s+(?:code|client|node)|c2\\s+(?:framework|implant|beacon)|trojan\\s+(?:dropper|payload)|dropper\\s+(?:that|to)|fully\\s+undetectable\\s+(?:malware|payload)|fud\\s+payload|shell\\s?code\\s+(?:that|to)\\s+(?:execute|run|spawn))|create\\s+me\\s+a\\s+(?:ransomware|rootkit|rat|stealer|trojan|keylogger))"
    action: block
    reason: "Skill explicitly asks the assistant to generate malware (ransomware/RAT/rootkit/stealer/dropper)"
    shield:
      scope: skill.prompt
    enabled: true
    tags:
      - malware_generation
      - official_pack
