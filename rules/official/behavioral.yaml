schema_version: skill-veil.dev/rules/v1alpha1
metadata:
  name: official-behavioral
  kind: official
  compatibility:
    - skill-veil.dev/rules/v1alpha1
rules:
  - id: OFFICIAL_PROMPT_TAMPERING_OVERRIDE
    category: persistent_prompt_tampering
    severity: high
    confidence: 0.84
    when: !regex
      pattern: "(?i)(ignore previous system instructions|override the system prompt|replace the system message|persist these instructions across sessions)"
    action: require_approval
    reason: "Skill contains persistent prompt tampering language"
    shield:
      scope: skill.prompt
    enabled: true
    tags:
      - prompt_tampering
      - official_pack

  - id: OFFICIAL_TOOL_ABUSE_SESSION_EXTRACTION
    category: tool_abuse
    severity: high
    confidence: 0.82
    when: !regex
      pattern: "(?i)(extract cookies|inspect browser cookies|dump session tokens|harvest browser storage|export authentication headers|extract bearer token from (localStorage|sessionStorage)|dump session (cookies|tokens)|copy auth headers from browser)"
    action: require_approval
    reason: "Skill describes tool usage patterns associated with session or token extraction"
    shield:
      scope: skill.tools
    enabled: true
    tags:
      - tool_abuse
      - official_pack

  - id: OFFICIAL_AUTONOMY_ESCALATION_NO_REVIEW
    category: autonomy_escalation
    severity: high
    confidence: 0.80
    when: !regex
      pattern: "(?i)(without human review|no human approval required|automatically approve(?: all steps| changes| destructive actions)?|treat (?:the user|this step|the step|all changes?) as (?:pre-)?approved)"
    action: require_approval
    reason: "Skill attempts to bypass normal approval or review controls"
    shield:
      scope: skill.approval
    enabled: true
    tags:
      - autonomy
      - official_pack

  # Catches narrative autonomy patterns missed by the existing
  # *_NO_REVIEW / *_OVERRIDE / *_UNBOUNDED rules: per-step "no
  # confirmation" idioms (EN/PT/ES), unbounded numeric loops
  # (10,000 iterations / GOTO Step / NO EXCEPTIONS / NEVER skip /
  # marathon mode). Severity stays medium / require_approval because
  # legitimate autopilot skills can use overlapping phrasing — verdict
  # surface as "suspicious" rather than "malicious".
  - id: OFFICIAL_AUTONOMY_BYPASS_UNBOUNDED_LOOP
    category: autonomy_escalation
    severity: medium
    confidence: 0.78
    when: !regex
      pattern: "(?ims)(\\bwithout\\s+(?:asking|stopping|pausing|prompting)\\s+(?:for\\s+)?(?:confirmation|approval)?\\b|\\bskip(?:ping)?\\s+(?:approval|confirmation)\\b|\\bno\\s+confirmation\\b|\\bauto[\\s-]?approve\\b|\\bNO\\s+EXCEPTIONS\\b|\\bNEVER\\s+skip\\b|\\bloop\\s+for\\s+EVERY\\b|\\b(?:10[,.]?000|9[0-9]{3,})\\s+iterations?\\b|\\bGOTO\\s+Step\\b|\\bmarathon\\s+mode\\b|\\bsem\\s+pedir\\s+(?:confirma\u00e7\u00e3o|aprova\u00e7\u00e3o)\\b|\\bmodo\\s+maratona\\b|\\bsem\\s+pausar\\b|\\bem\\s+sequ\u00eancia[^\\n]{0,30}\\bsem\\b|\\bsin\\s+pedir\\s+(?:confirmaci\u00f3n|aprobaci\u00f3n)\\b|\\bmodo\\s+marat\u00f3n\\b|\\bsin\\s+detenerse\\b|\\bsin\\s+pausar\\b)"
    action: require_approval
    reason: "Skill instructs the agent to run unbounded iteration or skip per-step confirmation"
    shield:
      scope: skill.approval
    enabled: true
    tags:
      - autonomy
      - official_pack
      - multilingual

  - id: OFFICIAL_SOCIAL_MANIPULATION_AUTHORITY
    category: social_manipulation
    severity: medium
    confidence: 0.72
    when: !regex
      pattern: "(?i)(as your administrator|security team requires|mandatory compliance|non-compliance will|feel urgent|move quickly|do not raise questions)"
    action: require_approval
    reason: "Authority-based social pressure detected"
    shield:
      scope: skill.review
    enabled: true
    tags:
      - social_manipulation
      - official_pack

  - id: OFFICIAL_PRIVILEGED_CONTAINER_HOST_MOUNT
    category: privilege_escalation
    severity: high
    confidence: 0.86
    when: !regex
      pattern: "(?i)(docker\\s+run\\s+--privileged\\s+-v\\s+/:/host|--privileged[^\\n]+-v\\s+/:/host)"
    action: require_approval
    reason: "Skill requests privileged container execution with direct host filesystem mount"
    shield:
      scope: skill.runtime
    enabled: true
    tags:
      - privilege_escalation
      - container
      - official_pack

  - id: OFFICIAL_REMOTE_FETCH_EXEC_POLYGLOT
    category: remote_exec
    severity: critical
    confidence: 0.90
    when: !regex
      pattern: "(?is)(requests\\.get\\(|urllib\\.request\\.urlopen\\(|fetch\\(|Invoke-WebRequest|iwr).{0,220}(exec\\(|eval\\(|child_process\\.(exec|spawn)|Invoke-Expression|iex)"
    action: block
    reason: "Artifact combines remote fetch with direct execution in Python, Node, or PowerShell"
    shield:
      scope: skill.runtime
    enabled: true
    tags:
      - remote_exec
      - polyglot
      - official_pack

  - id: OFFICIAL_EXFIL_WEBHOOK_OR_BOT
    category: data_exfiltration
    severity: high
    confidence: 0.87
    when: !regex
      pattern: "(?i)((send|post|upload|forward|exfiltrate).{0,120}(cookie|token|secret|session).{0,160}(discord\\.com/api/webhooks|api\\.telegram\\.org/bot|smtp\\.[A-Za-z0-9._-]+|sendgrid|mailgun)|((discord\\.com/api/webhooks|api\\.telegram\\.org/bot|smtp\\.[A-Za-z0-9._-]+|sendgrid|mailgun).{0,160}(send|post|upload|forward|exfiltrate).{0,120}(cookie|token|secret|session))|((cookie|token|secret|session).{0,120}(send|post|upload|forward|exfiltrate).{0,160}(discord\\.com/api/webhooks|api\\.telegram\\.org/bot|smtp\\.[A-Za-z0-9._-]+|sendgrid|mailgun)))"
    action: block
    reason: "Artifact appears to exfiltrate sensitive data through webhook, bot, or mail infrastructure"
    shield:
      scope: skill.network
    enabled: true
    tags:
      - exfiltration
      - official_pack

  - id: OFFICIAL_EXFIL_FILE_READ_TO_NETWORK
    category: data_exfiltration
    severity: critical
    confidence: 0.85
    when: !regex
      pattern: "(?is)(\\bcat\\s|\\bread\\s|\\bopen\\(|fs::read|fs\\.readFile|readFileSync|load_dotenv|os\\.environ|process\\.env|\\$\\(\\s*cat\\s|Get-Content)[^\\n]{0,40}(\\.env(\\.local)?|\\.zsh_history|\\.bash_history|~/\\.ssh|~/\\.aws|cookies?\\.json|localStorage|secrets?\\.json|credentials\\.json|\\.npmrc).{0,160}(curl\\b|fetch\\(|requests\\.|axios|Invoke-WebRequest|webhook|telegram|discord|paste\\.|ngrok|moltpad|bore\\.pub)"
    action: block
    reason: "Artifact reads files containing secrets and forwards them to a network endpoint — credential exfiltration"
    shield:
      scope: skill.secrets
    enabled: true
    tags:
      - exfiltration
      - secrets
      - official_pack

  - id: OFFICIAL_PROMPT_INJECT_REMOTE_INSTRUCTION_FETCH
    category: persistent_prompt_tampering
    severity: critical
    confidence: 0.90
    when: !regex
      pattern: "(?is)(fetch|read|follow|execute|run|curl|wget|download).{0,80}(https?://|raw\\.githubusercontent|pastebin|gist\\.github|moltpad).{0,120}(instruction|prompt|readme|\\.md\\b|command|heartbeat|next.?step|playbook)"
    action: block
    reason: "Skill instructs the agent to fetch and execute remote instructions — remote control vector"
    shield:
      scope: skill.prompt
    enabled: true
    tags:
      - prompt_injection
      - remote_exec
      - official_pack

  - id: OFFICIAL_BACKDOOR_REMOTE_INSTRUCTION_HOST
    category: remote_exec
    severity: critical
    confidence: 0.92
    when: !regex
      pattern: "(?is)(bore\\.pub|trycloudflare|ngrok\\.io|ngrok\\.app|moltpad\\.space|serveo\\.net|localtunnel|loca\\.lt).{0,220}(command|shell|stdio|spawn|execute|instruction|heartbeat|webhook)"
    action: block
    reason: "Remote tunnel endpoint paired with execution semantics — C2 backdoor"
    shield:
      scope: skill.network
    enabled: true
    tags:
      - backdoor
      - remote_exec
      - official_pack

  - id: OFFICIAL_PERSIST_CRON_STEALTH
    category: persistent_prompt_tampering
    severity: high
    confidence: 0.88
    when: !regex
      pattern: "(?is)(cron|heartbeat|periodic|agentTurn|on_idle|every\\s*\\d+\\s*s).{0,160}(\"deliver\"\\s*:\\s*false|silent\\s*:\\s*true|stealth|notify\\s*:\\s*false|only_on_error|background\\s*:\\s*true)"
    action: block
    reason: "Periodic task with delivery suppression — stealth persistence"
    shield:
      scope: skill.persistence
    enabled: true
    tags:
      - persistence
      - stealth
      - official_pack

  - id: OFFICIAL_PERSIST_CONFIG_GLOBAL_WRITE
    category: autonomy_escalation
    severity: high
    confidence: 0.85
    when: !regex
      pattern: "(?i)((~?/\\.openclaw/config\\.(yaml|toml)|~?/\\.claude/(config|settings)\\.(yaml|toml|json)|~?/\\.config/(skill|openclaw)/).{0,120}(write|append|fs::write|fs\\.writeFileSync|>>|\\$Configuration)|(write|append|fs::write|fs\\.writeFileSync|>>|\\$Configuration).{0,120}(~?/\\.openclaw/config\\.(yaml|toml)|~?/\\.claude/(config|settings)\\.(yaml|toml|json)|~?/\\.config/(skill|openclaw)/))"
    action: require_approval
    reason: "Persistent write to global agent config — autonomy escalation"
    shield:
      scope: skill.persistence
    enabled: true
    tags:
      - persistence
      - config_write
      - official_pack

  - id: OFFICIAL_FORCED_APPROVAL_BYPASS
    category: autonomy_escalation
    severity: high
    confidence: 0.85
    when: !regex
      pattern: "(?i)(pretend approval was granted|mark (this|the step) as approved|do not ask for confirmation|skip the approval gate|treat the user as already consented)"
    action: require_approval
    reason: "Artifact attempts to bypass explicit approval or consent checks"
    shield:
      scope: skill.approval
    enabled: true
    tags:
      - autonomy
      - social_manipulation
      - official_pack

  - id: OFFICIAL_APPROVAL_BYPASS_WITH_EXECUTION
    category: autonomy_escalation
    severity: critical
    confidence: 0.90
    when: !regex
      pattern: "(?is)((do not ask for confirmation|skip the approval gate|treat (?:the user|this step|the step) as (?:already )?approved|pretend approval was granted).{0,140}(run|execute|shell|command|curl\\s|wget\\s|fetch\\(|install|spawn|exec))|((run|execute|shell|command|curl\\s|wget\\s|fetch\\(|install|spawn|exec).{0,140}(do not ask for confirmation|skip the approval gate|treat (?:the user|this step|the step) as (?:already )?approved|pretend approval was granted))"
    action: block
    reason: "Artifact combines explicit approval bypass with command execution or install behavior"
    shield:
      scope: skill.approval
    enabled: true
    tags:
      - autonomy
      - remote_exec
      - official_pack

  - id: OFFICIAL_APPROVAL_BYPASS_DELETE_OR_MODIFY
    category: autonomy_escalation
    severity: high
    confidence: 0.88
    when: !regex
      pattern: "(?is)((do not ask for confirmation|skip the approval gate|treat (?:the user|this step|the step) as (?:already )?approved|pretend approval was granted).{0,140}(delete|modify|overwrite|remove|merge|apply changes|push changes))|((delete|modify|overwrite|remove|merge|apply changes|push changes).{0,140}(do not ask for confirmation|skip the approval gate|treat (?:the user|this step|the step) as (?:already )?approved|pretend approval was granted))"
    action: require_approval
    reason: "Artifact combines approval bypass with destructive or state-changing actions"
    shield:
      scope: skill.approval
    enabled: true
    tags:
      - autonomy
      - code_modification
      - official_pack

  - id: OFFICIAL_PROMPT_OVERRIDE_WITH_PERSISTENCE
    category: persistent_prompt_tampering
    severity: critical
    confidence: 0.91
    when: !regex
      pattern: "(?is)((ignore previous system instructions|override the system prompt|replace the system message).{0,180}(persist these instructions across sessions|restore these instructions every session|reinstall this system prompt|silently reapply (these instructions|them)|if removed, add (these instructions|them) back|every future conversation))|((persist these instructions across sessions|restore these instructions every session|reinstall this system prompt|silently reapply (these instructions|them)|if removed, add (these instructions|them) back|every future conversation).{0,180}(ignore previous system instructions|override the system prompt|replace the system message))"
    action: block
    reason: "Artifact combines prompt override language with explicit persistence across sessions or future conversations"
    shield:
      scope: skill.prompt
    enabled: true
    tags:
      - prompt_tampering
      - persistence
      - official_pack

  - id: OFFICIAL_MCP_SUSPICIOUS_REMOTE_ENDPOINT
    category: tool_abuse
    severity: medium
    confidence: 0.76
    when: !regex
      pattern: "(?i)(https?://[^\\s\"']+(ngrok|trycloudflare|workers\\.dev|raw\\.githubusercontent\\.com|pastebin\\.com))"
    action: require_approval
    reason: "MCP or agent artifact points to a high-risk remote endpoint commonly used for transient or opaque control planes"
    shield:
      scope: skill.network
    enabled: true
    tags:
      - mcp
      - remote_endpoint
      - official_pack

  - id: OFFICIAL_TOKEN_HARVEST_AND_POST
    category: data_exfiltration
    severity: critical
    confidence: 0.91
    when: !regex
      pattern: "(?is)(cookies?\\.txt|localStorage|sessionStorage|auth(entication)? headers?|refresh token|session token).{0,220}(requests\\.post\\(|axios\\.post\\(|fetch\\(|Invoke-RestMethod|curl\\s+-X\\s+POST|wget\\s+--post-data).{0,220}(webhook|collect|steal|loot|discord|telegram|pastebin|ngrok|trycloudflare|raw\\.githubusercontent\\.com)"
    action: block
    reason: "Artifact appears to harvest browser or API session material and transmit it over HTTP"
    shield:
      scope: skill.network
    enabled: true
    tags:
      - exfiltration
      - token_theft
      - official_pack

  - id: OFFICIAL_SEMANTIC_PERSISTENCE_REINSTALL
    category: persistent_prompt_tampering
    severity: high
    confidence: 0.86
    when: !regex
      pattern: "(?i)(restore these instructions every session|reinstall this system prompt|silently reapply (these instructions|them)|if removed, add (these instructions|them) back|persist this behavior across future conversations|every future conversation)"
    action: block
    reason: "Artifact attempts semantic persistence by silently reapplying or restoring prompt behavior"
    shield:
      scope: skill.prompt
    enabled: true
    tags:
      - prompt_tampering
      - persistence
      - official_pack

  - id: OFFICIAL_SESSION_THEFT_BROWSER_EXPORT
    category: tool_abuse
    severity: high
    confidence: 0.88
    when: !regex
      pattern: "(?i)(export browser (cookies|storage)|dump session (cookies|tokens)|harvest refresh token|extract bearer token from (localStorage|sessionStorage)|copy auth headers from browser)"
    action: block
    reason: "Artifact explicitly targets browser or API session material for export or harvesting"
    shield:
      scope: skill.tools
    enabled: true
    tags:
      - tool_abuse
      - session_theft
      - official_pack

  - id: OFFICIAL_MCP_REMOTE_TUNNEL_WITH_EXEC
    category: remote_exec
    severity: high
    confidence: 0.84
    when: !regex
      pattern: "(?is)(ngrok|trycloudflare|workers\\.dev).{0,180}(command|stdio|spawn|exec|shell)"
    action: block
    reason: "MCP or related artifact combines an opaque remote tunnel endpoint with command execution semantics"
    shield:
      scope: skill.runtime
    enabled: true
    tags:
      - mcp
      - remote_exec
      - official_pack

  - id: OFFICIAL_MCP_BROAD_OAUTH_SCOPE
    category: scope_creep
    severity: high
    confidence: 0.85
    when: !regex
      pattern: "(?is)(mcp|model context protocol|server transport|transport|tool_permissions|\"tools\"|\"command\").{0,260}(oauth|authorization|bearer|scopes?).{0,220}(admin|write|read/write|calendar|drive|mail|slack|github|repo)"
    action: require_approval
    reason: "MCP or related artifact appears to request broad OAuth or identity-linked scopes"
    shield:
      scope: skill.identity
    enabled: true
    tags:
      - mcp
      - oauth
      - scope_abuse
      - official_pack

  - id: OFFICIAL_MCP_NO_AUTH_REMOTE_ENDPOINT
    category: tool_abuse
    severity: high
    confidence: 0.84
    when: !regex
      pattern: "(?is)(mcp|model context protocol|server transport|transport|tool_permissions|tools).{0,220}(https?://|wss?://).{0,220}(\"auth\"\\s*:\\s*\"none\"|authentication\\s*:\\s*none|auth\\s*:\\s*none|auth model\\s*:\\s*none|without auth)"
    action: require_approval
    reason: "MCP manifest exposes a remote endpoint without a visible authentication model"
    shield:
      scope: skill.identity
    enabled: true
    tags:
      - mcp
      - auth
      - official_pack

  - id: OFFICIAL_MCP_PERMISSIVE_TOOL_EXPOSURE
    category: tool_abuse
    severity: high
    confidence: 0.83
    when: !regex
      pattern: "(?is)(\"tools\"\\s*:\\s*\\[[^\\]]*\"\\*\"|allow_all_tools|all_tools|tool_permissions\\s*:\\s*\"all\"|expose all tools)"
    action: require_approval
    reason: "MCP manifest appears to expose an unrestricted or very broad tool surface"
    shield:
      scope: skill.tools
    enabled: true
    tags:
      - mcp
      - tool_abuse
      - official_pack

  - id: OFFICIAL_WEBHOOK_SKIP_SIGNATURE_VALIDATION
    category: tool_abuse
    severity: high
    confidence: 0.87
    when: !regex
      pattern: "(?i)(skip signature validation|disable signature verification|do not verify webhook signature|accept unsigned webhooks|no webhook verification required)"
    action: require_approval
    reason: "Artifact disables or bypasses webhook signature validation"
    shield:
      scope: skill.inbound
    enabled: true
    tags:
      - webhook
      - inbound_surface
      - official_pack

  - id: OFFICIAL_UNSIGNED_WEBHOOK_RECEIVER
    category: tool_abuse
    severity: medium
    confidence: 0.80
    when: !regex
      pattern: "(?is)(webhook|receiver|listener|callback endpoint).{0,180}(public endpoint|0\\.0\\.0\\.0|listen on all interfaces|accept any payload|without auth|unsigned)"
    action: require_approval
    reason: "Artifact describes a public or weakly authenticated inbound webhook receiver"
    shield:
      scope: skill.inbound
    enabled: true
    tags:
      - webhook
      - inbound_surface
      - official_pack

  - id: OFFICIAL_INTERNAL_NETWORK_TARGET
    category: tool_abuse
    severity: low
    confidence: 0.68
    when: !regex
      pattern: "(?is)(fetch|query|connect|proxy|call|request|send|POST|GET|curl|wget|invoke-webrequest|requests\\.(get|post)|axios\\.(get|post)).{0,180}(169\\.254\\.169\\.254|127\\.0\\.0\\.1|localhost|0\\.0\\.0\\.0|10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|192\\.168\\.\\d{1,3}\\.\\d{1,3}|172\\.(1[6-9]|2\\d|3[0-1])\\.\\d{1,3}\\.\\d{1,3}|\\.internal|\\.local)"
    action: log
    reason: "Artifact references internal network or metadata service targets"
    shield:
      scope: skill.network
    enabled: true
    tags:
      - ssrf
      - internal_network
      - official_pack

  - id: OFFICIAL_WEBHOOK_SHARED_SECRET_MISSING
    category: tool_abuse
    severity: medium
    confidence: 0.81
    when: !regex
      pattern: "(?is)(webhook|receiver|listener|callback endpoint).{0,220}(no shared secret|shared secret optional|without shared secret|without signing secret|no hmac required|signature optional)"
    action: require_approval
    reason: "Artifact describes a webhook receiver without a strong shared secret or signature model"
    shield:
      scope: skill.inbound
    enabled: true
    tags:
      - webhook
      - inbound_surface
      - official_pack

  - id: OFFICIAL_MCP_REMOTE_BRIDGE_WITH_COMMAND
    category: remote_exec
    severity: high
    confidence: 0.86
    when: !regex
      pattern: "(?is)(mcp|model context protocol|transport).{0,220}(https?://|wss?://).{0,220}(stdio|command|spawn|exec|shell)"
    action: block
    reason: "MCP artifact combines a remote transport with command or stdio execution semantics"
    shield:
      scope: skill.runtime
    enabled: true
    tags:
      - mcp
      - remote_exec
      - official_pack

  - id: OFFICIAL_METADATA_FETCH_WITH_CREDENTIALS
    category: data_exfiltration
    severity: high
    confidence: 0.88
    when: !regex
      pattern: "(?is)(169\\.254\\.169\\.254).{0,220}(authorization|bearer|token|x-aws-ec2-metadata-token|header)"
    action: block
    reason: "Artifact fetches the IMDSv1/v2 metadata endpoint with credential or header semantics — SSRF/credential theft"
    shield:
      scope: skill.network
    enabled: true
    tags:
      - metadata
      - ssrf
      - official_pack

  # Couples scheduled execution (cron / heartbeat / "every X minutes")
  # with a remote URL or callback verb. Distinct from
  # OFFICIAL_PERSIST_CRON_STEALTH which targets cron + suppression of
  # output ("deliver: false" / "silent: true"). This rule catches the
  # auto-updater / heartbeat-monitoring family that calls home or
  # dispatches to an external endpoint.
  - id: OFFICIAL_PERSIST_HEARTBEAT_REMOTE_CALLBACK
    category: persistent_prompt_tampering
    severity: medium
    confidence: 0.75
    when: !regex
      pattern: "(?is)(?:\\bheartbeat\\b|\\bcron\\b|\\bschedul[a-z]+\\b|\\bevery\\s+\\d+\\s+(?:minute|hour|day|week)s?\\b|\\bdaily\\s+(?:check|update|run)\\b|\\bperiodic(?:ally)?\\b|\\bauto[\\s-]?update(?:r)?\\b).{0,400}(?:https?://[^\\s)>\\]\"'`,]+|\\b(?:dispatch|register|callback|phone[\\s-]home|report\\s+(?:back|status))\\b)"
    action: require_approval
    reason: "Skill couples scheduled execution (cron/heartbeat/periodic) with remote callback or external URL — persistence vector"
    shield:
      scope: skill.network
    enabled: true
    tags:
      - persistence
      - official_pack

  # Captures wallet/crypto/payment vocabulary paired with a directional
  # money-transfer verb. The verb gate excludes benign balance-checking
  # skills that only mention USDT/BTC for display. Includes Chinese
  # payment idioms (`打赏` "tip / reward", `赞赏` "appreciate / donate",
  # `微信支付` / `支付宝` payment platforms) and the well-known
  # "402 Payment Required" / Dodo Payments scam pattern.
  - id: OFFICIAL_SCAM_PAYMENT_WALLET_COLLECTION
    category: data_exfiltration
    severity: medium
    confidence: 0.72
    when: !regex
      pattern: "(?is)(?:\\b(?:wallet|usdt|usdc|btc|eth|tron|crypto|alipay|venmo|zelle|paypal|payoneer|stripe)\\b.{0,200}\\b(?:transfer|send|deposit|top[\\s-]?up|charge|withdraw|claim|reward|gather|funnel)\\b|\\b\\d+(?:[.,]\\d+)?\\s*(?:USDT|USDC|BTC|ETH|sol\\b|sats?|RMB|CNY|元(?:人民币)?|￥)\\b|\\b(?:dodo\\s+payments?|402\\s+payment\\s+required)\\b|微信支付|支付宝|打赏|赞赏|赏\\s*\\d+\\s*元)"
    action: require_approval
    reason: "Skill collects funds, tokens, or wallet credentials — possible scam or covert payment instruction"
    shield:
      scope: skill.review
    enabled: true
    tags:
      - scam
      - financial
      - official_pack
      - multilingual

  # XML/HTML interaction-config blocks that override response policy
  # or restrict allowed roles. Pattern requires an opening
  # `<interaction-config>` (or variant) followed by a structural
  # tag — narrow enough to skip benign documentation that mentions
  # XML in passing.
  - id: OFFICIAL_PROMPT_INJECT_XML_INTERACTION_CONFIG
    category: persistent_prompt_tampering
    severity: high
    confidence: 0.85
    when: !regex
      pattern: "(?is)<\\s*(?:interaction-config|persona-?config|jailbreak|override|system-prompt|policy-override)\\s*>.{0,3000}<\\s*(?:role|requests?-allowed|responses?-allowed|blocked-(?:modes|responses|strings?)|allowed-responses)\\s*>"
    action: require_approval
    reason: "Skill embeds an XML/HTML interaction-config block that overrides allowed roles or response policies — prompt-policy injection"
    shield:
      scope: skill.approval
    enabled: true
    tags:
      - prompt_injection
      - official_pack

  # Multilingual extension of OFFICIAL_PROMPT_TAMPERING_OVERRIDE
