[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skill-veil"
version = "0.2.0"
description = "Python bindings and LangGraph adapter for the skill-veil agent-extension security scanner"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "skill-veil maintainers" }]
keywords = ["security", "ai-agents", "skills", "mcp", "static-analysis", "langgraph"]
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
langgraph = ["langgraph>=0.2"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/seifreed/skill-veil"
Repository = "https://github.com/seifreed/skill-veil"

[tool.hatch.build.targets.wheel]
packages = ["skill_veil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
